/* ---- 0.7.3: equal start choices, no black blocks ---- */
.choices{display:grid;gap:1rem;width:100%;max-width:52rem;margin-top:.5rem;grid-template-columns:repeat(auto-fit,minmax(min(17rem,100%),1fr))}
.choice{display:flex;align-items:center;justify-content:space-between;gap:1rem;text-align:left;font:inherit;cursor:pointer;border-radius:var(--r-lg);padding:1.25rem 1.4rem;min-height:6rem;border:2px solid var(--brand);background:var(--surface);color:var(--ink)}
.choice>span{display:grid;gap:.3rem}
.choice b{font:600 1.3rem var(--f-head)}
.choice>span>span{color:var(--ink-2);font-size:1rem;line-height:1.45}
.choice .ic{width:1.5rem;height:1.5rem;color:var(--brand-text)}
.choice:hover{background:var(--brand-tint)}
.choice:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.choice-a{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.choice-a b{color:var(--brand-ink)}
.choice-a>span>span{color:var(--brand-ink);opacity:.92}
.choice-a .ic{color:var(--brand-ink)}
.choice-a:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn[aria-pressed=true]{background:var(--brand-tint);color:var(--brand-text);border-color:var(--brand)}
.start .lede{max-width:40ch}
.start{grid-template-columns:minmax(0,1fr)}
.choice,.choice>span{min-width:0}
.choice b,.choice>span>span{overflow-wrap:break-word}
/* ---- 0.7.4: grouped first question ---- */
.needgroups{display:grid;gap:1.5rem;margin-top:1rem}
.needgroup{border:0;margin:0;padding:0;min-width:0}
.needgroup>legend{font:600 1.1rem var(--f-head);color:var(--ink);padding:0;margin-bottom:.1rem}
.needgroup .opts{margin-top:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(15rem,100%),1fr));gap:.6rem}
.needgroup .opt{padding:.75rem 1rem;min-height:3rem}
.needgroup .opt .h{font-size:.95rem;line-height:1.4}
.wiz:has(.needgroups){max-width:62rem}
/* ---- 0.7.5: CAPA Good Care palette (purple headings, magenta actions, lilac tints) ---- */
html:not(.dark):not(.hc){--bg:#fbf8fc;--surface:#fff;--surface-2:#f6e9f5;--ink:#2a1f33;--ink-2:#5c5066;--line:#e6dcea;--line-strong:#8a7b94;--brand:#9f3e94;--brand-hover:#82307a;--brand-ink:#fff;--brand-tint:#f6e9f5;--brand-text:#582d80;--focus:#582d80;--shadow:0 1px 2px #2a1f330d,0 2px 8px #582d800d}
html.dark{--bg:#17111c;--surface:#211829;--surface-2:#2c2035;--ink:#f2eaf5;--ink-2:#cdbfd4;--line:#3a2d44;--line-strong:#9a8aa4;--brand:#e08ad6;--brand-hover:#eaa6e2;--brand-ink:#1b1020;--brand-tint:#2c2035;--brand-text:#e8b8e5;--focus:#e8b8e5;--focus-gap:#17111c}
html:not(.hc) h1,html:not(.hc) h2{color:var(--brand-text)}
html:not(.hc) .start .kicker{color:var(--brand)}
html:not(.dark):not(.hc) .firstpanel{background:var(--brand-tint);border-color:#d9b6dc}
html:not(.dark):not(.hc) .firstpanel li:before{background:var(--brand-text)}
.xtra .cl{margin:0;max-width:64ch}
.xtra .cl li label{display:flex;align-items:flex-start;gap:.85rem;cursor:pointer;line-height:1.5}
.xtra .cl li label .box{margin-top:.05rem}
/* ---- 0.7.7: roomier checklist ---- */
.xtra .cl{display:grid;gap:.6rem;margin:0;padding:0;list-style:none;max-width:none}
.xtra .cl li{margin:0}
.xtra .cl li label{display:grid;grid-template-columns:1.5rem minmax(0,1fr);align-items:start;gap:.9rem;padding:.85rem 1rem;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);cursor:pointer;line-height:1.55;max-width:70ch}
.xtra .cl li label .box{margin:.1rem 0 0}
.xtra .cl li label:has(:checked){background:var(--brand-tint);border-color:var(--brand)}
.xtra .cl li label:has(:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.xtra .cl li label{max-width:none}
</style>
<div id="root"></div>

</body></html>
